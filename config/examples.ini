# Explicitly load with: setoption name VariantConfigPath value config/examples.ini
# FSF's present FEN check counters use one digit: this is 7-check, not unbounded N.
[stockless-7check:3check]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 7+7 0 1

# A small, independently named custom fairy-piece example.
# The archbishop combines bishop and knight movements using Betza BN.
[stockless-archbishop:chess]
customPiece1 = a:BN
pieceToCharTable = PNBRQ............A...Kpnbrq............a...k
startFen = rnbakbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBAKBNR w - - 0 1
castling = false
